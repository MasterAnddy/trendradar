name: Breaking Feed Cloud

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      force_send:
        description: "Send current alerts immediately"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: write

concurrency:
  group: trendradar-state-writers-${{ github.ref_name }}
  queue: max
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      BREAKING_FEED_TIMEZONE: "Asia/Tokyo"
      PYTHONUTF8: "1"
      TZ: "Asia/Tokyo"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests==2.32.4

      - name: Resolve force-send flag
        id: flags
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force_send }}" = "true" ]; then
            echo "force_send=--force-send" >> "$GITHUB_OUTPUT"
          else
            echo "force_send=" >> "$GITHUB_OUTPUT"
          fi

      - name: Run breaking feed
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python breaking_feed.py ${{ steps.flags.outputs.force_send }}

      - name: Commit breaking-feed state
        shell: bash
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          mkdir -p output/.breaking_feed
          git add -A output/.breaking_feed
          if git diff --cached --quiet; then
            echo "No breaking-feed state changes to persist"
            exit 0
          fi
          git commit -m "Breaking feed update $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M:%S')"
          for attempt in 1 2 3 4; do
            git fetch --no-tags --depth=5 origin "$GITHUB_REF_NAME"
            if ! git rebase FETCH_HEAD; then
              git rebase --abort || true
              echo "::error::Breaking-feed state conflicts with a newer remote commit"
              exit 1
            fi
            if git push origin "HEAD:$GITHUB_REF_NAME"; then
              exit 0
            fi
            if [ "$attempt" -eq 4 ]; then
              echo "::error::GitHub rejected the state push after 4 attempts"
              exit 1
            fi
            delay=$((attempt * 10))
            echo "::warning::State push attempt $attempt failed; retrying in ${delay}s"
            sleep "$delay"
          done
